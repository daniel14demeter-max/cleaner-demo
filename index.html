<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cleaner</title>
<style>
:root{--blue:#2f6bff;--blue2:#5aa2ff;--rgb:47,107,255;--rgb2:90,162,255;--lrgb:110,145,225;--t1:#e4eeff;--t2:#cfe0ff;--b1:#e6efff;--b3:#e3edff;--ink:#0f1b3d;--mut:#6b7a99;--line:rgba(var(--lrgb),.28);--glass:rgba(255,255,255,.62);--glow:0 10px 34px rgba(var(--rgb),.25)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,Segoe UI,Arial,sans-serif}
body{background:linear-gradient(135deg,var(--b1) 0%,#f8fbff 50%,var(--b3) 100%);display:flex;justify-content:center;min-height:100vh;color:var(--ink);position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
body::before{background:rgba(var(--rgb),.35);top:-120px;left:-120px}
body::after{background:rgba(var(--rgb2),.35);bottom:-140px;right:-120px}
#app{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;background:rgba(255,255,255,.28);backdrop-filter:blur(6px);box-shadow:0 0 60px rgba(var(--rgb),.12)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.7);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;pointer-events:none}header{min-height:66px}header button.in{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-color:transparent}.hiba{color:#d93a4a;font-size:13px;font-weight:700;margin-top:12px}
.logo .lg{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(var(--rgb),.45)}
.logo .lg svg{width:19px;height:19px}
.logo span{font-size:21px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(90deg,var(--ink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
header button{background:rgba(255,255,255,.8);border:1px solid var(--line);color:var(--blue);width:38px;height:38px;border-radius:12px;cursor:pointer;display:grid;place-items:center;font-size:22px;transition:.25s}
header button svg{width:19px;height:19px}
header button:hover{box-shadow:var(--glow);transform:translateY(-2px)}
.nyelv{display:flex;gap:4px;margin:14px 18px 0;padding:4px;border-radius:14px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 24px rgba(var(--rgb),.08)}
.nyelv button{flex:1;padding:9px 0;border:0;border-radius:10px;background:transparent;color:var(--mut);font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:.25s}
.nyelv button:hover{color:var(--blue)}
.nyelv button.on{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 6px 18px rgba(var(--rgb),.4)}
.demo{margin:12px 18px 0;background:rgba(255,255,255,.55);border:1px dashed var(--line);color:var(--mut);font-size:11.5px;text-align:center;padding:6px;border-radius:10px}
.szinek{display:none;justify-content:center;gap:12px;margin:12px 18px 0}.szinek button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:.25s}.szinek button:hover{transform:scale(1.15)}.szinek button.on{box-shadow:0 0 0 2px var(--blue),0 4px 14px rgba(var(--rgb),.5)}
.lepes{display:flex;gap:6px;padding:14px 18px 0}
.lepes i{flex:1;height:5px;border-radius:3px;background:rgba(var(--lrgb),.2);transition:.4s}
.lepes i.on{background:linear-gradient(90deg,var(--blue),var(--blue2));box-shadow:0 0 10px rgba(var(--rgb),.6)}
main{flex:1;padding:18px 18px 120px}
main.anim{animation:fel .45s ease}
@keyframes fel{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.al{color:var(--mut);font-size:14px;margin-bottom:16px;line-height:1.45}
.kartya{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.95);border-radius:20px;padding:14px;margin-bottom:12px;display:flex;gap:13px;align-items:center;cursor:pointer;box-shadow:0 8px 30px rgba(var(--rgb),.10);transition:transform .25s,box-shadow .25s,border-color .25s}
.kartya:hover{transform:translateY(-3px);box-shadow:0 14px 38px rgba(var(--rgb),.2)}
.kartya.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(var(--rgb),.35),var(--glow);background:rgba(255,255,255,.85)}
.lista .kartya{cursor:default}
.kartya .ik{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--t1),var(--t2));color:var(--blue)}
.kartya .ik svg{width:24px;height:24px}
.kartya.on .ik{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 6px 16px rgba(var(--rgb),.45)}
.kartya>div:nth-child(2){flex:1;min-width:0}
.kartya b{display:block;font-size:15.5px}
.kartya small{color:var(--mut);font-size:12.5px}
.kartya .ar{margin-left:auto;font-weight:800;color:var(--blue);white-space:nowrap;font-size:15px}
.kartya a{color:var(--blue);font-size:13px;font-weight:700;cursor:pointer}
.kartya ul{margin:8px 0 0 18px;font-size:13.5px;line-height:1.7;color:#33415f}
.kartya ul li::marker{color:var(--blue)}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 6px 16px rgba(var(--rgb),.4)}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:.25s;background:#fff}
.chk svg{width:15px;height:15px}
.kartya.on .chk{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(var(--rgb),.5)}
.csillag{color:#f5b301}
label{display:block;font-size:12.5px;font-weight:700;margin:14px 0 6px;color:#33415f}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid rgba(255,255,255,.95);border-radius:14px;font-size:16px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);color:var(--ink);box-shadow:0 4px 16px rgba(var(--rgb),.08);transition:.25s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(var(--rgb),.22),var(--glow)}
.sor{display:flex;gap:10px}.sor>div{flex:1}
.osszeg{background:var(--glass);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.95);border-radius:20px;padding:8px 16px;margin-top:6px;box-shadow:0 8px 30px rgba(var(--rgb),.1)}
.osszeg div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
.osszeg div span:first-child{color:var(--mut)}
.osszeg div span:last-child{text-align:right;font-weight:600}
.osszeg div:last-child{border:0;font-weight:800;font-size:19px}
.osszeg div:last-child span:first-child{color:var(--ink)}
.osszeg div:last-child span:last-child{color:var(--blue)}
footer{position:fixed;bottom:0;width:100%;max-width:430px;padding:14px 18px;background:rgba(255,255,255,.75);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;gap:10px;z-index:6}
.gomb{flex:1;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:16.5px;font-weight:800;cursor:pointer;box-shadow:0 10px 28px rgba(var(--rgb),.45);transition:transform .25s,box-shadow .25s}
.gomb:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 36px rgba(var(--rgb),.55)}
.gomb:active:not(:disabled){transform:scale(.98)}
.gomb:disabled{background:#c5d3ee;box-shadow:none;cursor:not-allowed}
.kesz{text-align:center;padding:26px 6px}
.kesz .ok{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 0 0 10px rgba(var(--rgb),.12),0 0 40px rgba(var(--rgb),.55);animation:pop .6s ease}
.kesz .ok svg{width:46px;height:46px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.allapot{display:flex;justify-content:space-between;margin:26px 0 10px;font-size:12px;color:var(--mut)}
.allapot span.on{color:var(--blue);font-weight:800}
.sav{height:8px;background:rgba(var(--lrgb),.2);border-radius:4px;overflow:hidden}
.sav div{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));width:33%;transition:width .8s;box-shadow:0 0 12px rgba(var(--rgb),.7)}
</style>

  }
  $('tartalom').innerHTML=h;$('lab').innerHTML=g;
